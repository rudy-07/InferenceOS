[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inferenceos"
version = "1.0.0"
description = "Operating System for Local AI Inference"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9.0",
    "py-cpuinfo>=9.0.0",
    "GPUtil>=1.4.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
inferenceos = "cli.main:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "inferenceos*", "async_scheduler*", "igpu_support*", "inference_runtime*", "layer_migration*", "layer_placement*", "memory_manager*", "orchestrator*", "profiler*", "runtime_memory*", "runtime_profiler*", "setup*"]
