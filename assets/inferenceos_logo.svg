<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Emerald & Neon Mint Gradient -->
    <linearGradient id="infGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Secondary Depth Gradient -->
    <linearGradient id="infGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Ambient Core Radial Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#060D0A" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Bloom Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="256" cy="256" r="215" fill="url(#coreGlow)" />

  <!-- Back Ribbon Loop (Compute Orbit) -->
  <path d="M 142 178 C 142 108, 370 108, 370 256 C 370 348, 292 410, 212 400 C 152 392, 102 332, 112 260 C 116 230, 132 190, 172 150" 
        fill="none" stroke="url(#infGrad2)" stroke-width="44" stroke-linecap="round" opacity="0.88" />

  <!-- Front Interlocking Ribbon (Inference Flow) -->
  <path d="M 370 334 C 370 404, 142 404, 142 256 C 142 164, 220 102, 300 112 C 360 120, 410 182, 400 254 C 396 284, 380 324, 340 362" 
        fill="none" stroke="url(#infGrad1)" stroke-width="44" stroke-linecap="round" filter="url(#emeraldGlow)" />

  <!-- Inner Dynamic Aperture Core Node -->
  <circle cx="256" cy="256" r="30" fill="url(#infGrad1)" />
  <circle cx="256" cy="256" r="14" fill="#E6FFFA" opacity="0.95" />
  <circle cx="256" cy="256" r="6" fill="#064E3B" opacity="0.8" />
</svg>
